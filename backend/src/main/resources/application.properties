# Application Configuration
spring.application.name=kinetiq-backend
server.port=8080

# Profiles: Default to h2 for zero-configuration instant local development & testing,
# use -Dspring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql for MySQL
spring.profiles.default=h2

# JWT Security Configuration
kinetiq.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
kinetiq.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Global CORS config allowed origins
kinetiq.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
