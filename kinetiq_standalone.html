    const INITIAL_CHALLENGE_HISTORY = [
      { id: "hist-1", title: "Autumn Cardio Blitz (50 km)", category: "Cardio", date: "2026-09-28", result: "Completed", rank: "#14 of 420", badge: "🍁 Fall Pacer", points: 450 },

      { id: "hist-3", title: "Summer Shred 45-Day High Intensity", category: "HIIT", date: "2026-08-15", result: "Partial (82%)", rank: "#55 of 600", badge: "🔥 Summer Warrior", points: 280 }
    ];

    const WEIGHT_HISTORY = [
      { date: "Sep 08", weight: 64.8 },
      { date: "Sep 15", weight: 64.2 },
      { date: "Sep 22", weight: 63.7 },
      { date: "Sep 29", weight: 63.1 },
      { date: "Oct 06", weight: 62.5 }
    ];

    // --- APP CONTEXT ---
    const AppContext = createContext(null);

    const AppProvider = ({ children }) => {
      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('kinetiq_s_users');
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });
      const [currentUser, setCurrentUser] = useState(() => users[0]);
      const [workouts, setWorkouts] = useState(() => {
        const saved = localStorage.getItem('kinetiq_s_workouts');
        return saved ? JSON.parse(saved) : INITIAL_WORKOUTS;
      });
      const [content, setContent] = useState(() => {
        const saved = localStorage.getItem('kinetiq_s_content');
        return saved ? JSON.parse(saved) : INITIAL_CONTENT;
      });
      const [challenges, setChallenges] = useState(() => {
        const saved = localStorage.getItem('kinetiq_s_challenges');
        return saved ? JSON.parse(saved) : INITIAL_CHALLENGES;
      });
      const [weightHistory, setWeightHistory] = useState(WEIGHT_HISTORY);
      const [toasts, setToasts] = useState([]);
      const [activityLogs, setActivityLogs] = useState([
        { id: '1', action: 'Workout Logged', details: 'Sarah Jenkins logged 45 min Cardio', time: 'Just now' },
        { id: '2', action: 'Content Approved', details: 'Admin Dave approved "Optimal Protein Timing"', time: '15m ago' },
        { id: '3', action: 'Challenge Joined', details: 'Marcus Vance joined 100km Challenge', time: '1h ago' }
      ]);
      const [systemSettings, setSystemSettings] = useState({
        platformName: "Kinetiq",
        maintenanceMode: false,
        openRegistration: true,
        defaultUnit: "Metric",
        calorieTarget: 2200,
        enableAI: true
      });

      useEffect(() => {
        localStorage.setItem('kinetiq_s_users', JSON.stringify(users));
      }, [users]);
      useEffect(() => {
        localStorage.setItem('kinetiq_s_workouts', JSON.stringify(workouts));
      }, [workouts]);
      useEffect(() => {
        localStorage.setItem('kinetiq_s_content', JSON.stringify(content));
      }, [content]);
      useEffect(() => {
        localStorage.setItem('kinetiq_s_challenges', JSON.stringify(challenges));
      }, [challenges]);

      const showToast = (message, type = 'success', title = 'Success') => {
        const id = Date.now().toString();
        setToasts(prev => [{ id, message, type, title }, ...prev].slice(0, 4));
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      const switchUser = (id) => {
        const target = users.find(u => u.id === id);
        if (target) {
          setCurrentUser(target);
          showToast(`Switched active view to ${target.name} (${target.role})`, 'info', 'Persona Changed');
        }
      };

      // Workouts
      const logWorkout = (wo) => {
        const newWo = {
          id: `wo-${Date.now()}`,
          userId: currentUser.id,
          userName: currentUser.name,
          ...wo
        };
        setWorkouts(prev => [newWo, ...prev]);
        setActivityLogs(prev => [{ id: Date.now().toString(), action: 'Workout Logged', details: `${currentUser.name} logged ${newWo.title}`, time: 'Just now' }, ...prev]);
        showToast(`Workout "${newWo.title}" logged successfully!`, 'success', 'Workout Saved');
      };

      const deleteWorkout = (id) => {
        setWorkouts(prev => prev.filter(w => w.id !== id));
        showToast('Workout successfully deleted.', 'success', 'Workout Removed');
      };

      // Users
      const createUser = (u) => {
        const newUser = {
          id: `usr-${Date.now()}`,
          ...u,
          avatar: `https://images.unsplash.com/photo-${1534528741775 + Math.floor(Math.random() * 50000)}?w=150&auto=format&fit=crop&q=80`,
          streakDays: 0,
          points: 100,
          joinedDate: new Date().toISOString().split('T')[0]
        };
        setUsers(prev => [newUser, ...prev]);
        showToast(`User account "${newUser.name}" successfully created.`, 'success', 'User Created');
      };

      const updateUser = (id, fields) => {
        setUsers(prev => prev.map(u => u.id === id ? { ...u, ...fields } : u));
        if (currentUser.id === id) setCurrentUser(prev => ({ ...prev, ...fields }));
        showToast('User account successfully updated.', 'success', 'User Updated');
      };

      const deleteUser = (id) => {
        if (currentUser.id === id) {
          showToast('Cannot delete currently active account.', 'error', 'Action Restricted');
          return;
        }
        setUsers(prev => prev.filter(u => u.id !== id));
        showToast('User account successfully deleted.', 'success', 'User Deleted');
      };

      // Content Moderation
      const approveContent = (id) => {
        setContent(prev => prev.map(c => c.id === id ? { ...c, status: 'Approved' } : c));
        showToast('Content approved and published to the community!', 'success', 'Content Approved');
      };

      const rejectContent = (id, reason) => {
        setContent(prev => prev.map(c => c.id === id ? { ...c, status: 'Rejected', rejectionReason: reason } : c));
        showToast('Content submission rejected with feedback.', 'warning', 'Content Rejected');
      };

      // Challenges
      const joinChallenge = (id) => {
        setChallenges(prev => prev.map(c => c.id === id ? { ...c, userStatus: 'Joined', participantsCount: c.participantsCount + 1, userProgress: 1 } : c));
        showToast('Challenge joined successfully! Daily progress tracking active.', 'success', 'Challenge Joined');
      };

      const checkInChallenge = (id) => {
        setChallenges(prev => prev.map(c => c.id === id ? { ...c, userProgress: Math.min(c.totalDays, c.userProgress + 1) } : c));
        showToast('Daily challenge check-in recorded! Keep up the momentum.', 'success', 'Check-in Saved');
      };

      // Weight
      const logWeight = (wt) => {
        const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        setWeightHistory(prev => [...prev, { date: today, weight: Number(wt) }]);
        setCurrentUser(prev => ({ ...prev, weight: Number(wt) }));
        showToast(`New weigh-in recorded: ${wt} kg.`, 'success', 'Progress Logged');
      };

      // System Settings
      const saveSettings = (newSettings) => {
        setSystemSettings(newSettings);
        showToast('System configuration settings updated successfully.', 'success', 'Settings Saved');
      };

      const resetDemo = () => {
        localStorage.clear();
        setUsers(INITIAL_USERS);
        setCurrentUser(INITIAL_USERS[0]);
        setWorkouts(INITIAL_WORKOUTS);
        setContent(INITIAL_CONTENT);
        setChallenges(INITIAL_CHALLENGES);
        setWeightHistory(WEIGHT_HISTORY);
        showToast('Demo data restored to initial defaults.', 'info', 'Reset Complete');
      };

        <AppContext.Provider value={{
          users, currentUser, switchUser, createUser, updateUser, deleteUser,
          workouts, logWorkout, deleteWorkout,
          content, approveContent, rejectContent,
          challenges, joinChallenge, checkInChallenge,
          weightHistory, logWeight,
          activityLogs, systemSettings, saveSettings,
          toasts, showToast, resetDemo
        }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // --- MAIN COMPONENT ---
    function App() {
      const {
        users, currentUser, switchUser, createUser, updateUser, deleteUser,
        workouts, logWorkout, deleteWorkout,
        content, approveContent, rejectContent,
        challenges, joinChallenge, checkInChallenge,
        weightHistory, logWeight,

      const [isWorkoutModalOpen, setIsWorkoutModalOpen] = useState(false);
      const [isUserModalOpen, setIsUserModalOpen] = useState(false);

      const [woType, setWoType] = useState('Cardio');
      const [woTitle, setWoTitle] = useState('');
      const [woDuration, setWoDuration] = useState(45);
      const [woIntensity, setWoIntensity] = useState('Medium');
      const [woCalories, setWoCalories] = useState(350);
      const [woNotes, setWoNotes] = useState('');

      // Auto calculate calories
      useEffect(() => {
        const mult = woIntensity === 'Extreme' ? 12 : woIntensity === 'High' ? 9.5 : woIntensity === 'Medium' ? 7.2 : 4.5;
        setWoCalories(Math.round(woDuration * mult));
      }, [woDuration, woIntensity]);

      const handleSaveWorkout = (e) => {
        e.preventDefault();
        logWorkout({
          type: woType,
          title: woTitle || `${woType} Session`,
          duration: Number(woDuration),
          intensity: woIntensity,
          calories: Number(woCalories),
          date: new Date().toISOString().split('T')[0],
          notes: woNotes
        });
        setIsWorkoutModalOpen(false);
        setWoTitle('');
        setWoNotes('');
      };

      // Add User Form State
      const [newUserName, setNewUserName] = useState('');
      const [newUserEmail, setNewUserEmail] = useState('');
      const [newUserRole, setNewUserRole] = useState('User');
      const [newUserGoal, setNewUserGoal] = useState('Weight Loss');

        e.preventDefault();
        if (!newUserName || !newUserEmail) return;
        createUser({
          name: newUserName,
          email: newUserEmail,
          role: newUserRole,
          status: 'Active',
          fitnessGoal: newUserGoal,
          height: 172,
          weight: 70,
          targetWeight: 67
        });
        setIsUserModalOpen(false);
        setNewUserName('');
        setNewUserEmail('');
      };

      // Weight Log input
      const [weighInput, setWeighInput] = useState('');

        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
          
          {/* HEADER / NAVBAR */}

              {/* Brand Logo */}

                  K

                <div>

                  </div>
                  <p className="text-[10px] text-slate-400 hidden sm:block">GUVI Online Fitness Tracking Platform</p>
                </div>
              </div>

                  onClick={() => {
                    const u = users.find(x => x.role === 'User') || users[0];

                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    !isAdmin ? 'bg-cyan-500 text-black shadow-md' : 'text-slate-400 hover:text-white'
                  }`}

                  👤 User Mode
                </button>
                <button

                    const a = users.find(x => x.role === 'Admin') || users[1];

                    setActiveTab('admin-stats');

                  <button

                    + Log Workout
                  </button>

                  >
                    + Add User
                  </button>
                )}

                <button
                  onClick={resetDemo}
                  title="Reset Demo Data"
                  className="p-2 text-slate-400 hover:text-white bg-slate-900 border border-slate-800 rounded-xl text-xs"

                  ↺ Reset
                </button>

                <div className="flex items-center gap-2 p-1.5 bg-slate-900 border border-slate-800 rounded-xl">
                  <img src={currentUser.avatar} className="w-7 h-7 rounded-lg object-cover" />
                  <span className="text-xs font-bold hidden md:inline">{currentUser.name}</span>
                </div>
              </div>

            {/* Sub Nav Tabs */}
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-800/60 flex items-center gap-2 overflow-x-auto py-2">

                    { id: 'progress', label: 'Progress Tracking' },

            {/* ADMIN VIEW: SYSTEM SETTINGS */}
            {isAdmin && activeTab === 'admin-settings' && (
              <div className="max-w-2xl mx-auto p-6 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl space-y-4">
                <h3 className="text-lg font-bold text-white">System Settings & Parameters</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Platform Name</label>
                    <input type="text" defaultValue={systemSettings.platformName} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Default Daily Calorie Target</label>
                    <input type="number" defaultValue={systemSettings.calorieTarget} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center">
                    <div>
                      <span className="font-bold text-white block">Maintenance Mode</span>
                      <span className="text-slate-500 text-[10px]">Lock application for system updates</span>
                    </div>
                    <input type="checkbox" defaultChecked={systemSettings.maintenanceMode} className="w-4 h-4 accent-purple-500" />
                  </div>
                  <button
                    onClick={() => saveSettings(systemSettings)}
                    className="mt-4 px-5 py-2.5 bg-purple-600 text-white font-bold rounded-xl text-xs shadow-md"
                  >
                    Save System Settings
                  </button>
                </div>
              </div>
            )}

            {/* ADMIN VIEW: ACTIVITY MONITOR */}
            {isAdmin && activeTab === 'admin-activity' && (
              <div className="space-y-4">
                <div className="p-4 bg-slate-900/60 rounded-2xl border border-slate-800 flex justify-between items-center">
                  <h3 className="text-base font-bold text-white">Live System Activity Stream</h3>
                  <span className="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Live Streaming
                  </span>
                </div>

                <div className="p-6 rounded-2xl bg-slate-900/80 border border-slate-800 shadow-xl space-y-3">
                  {activityLogs.map(log => (
                    <div key={log.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                      <div>
                        <span className="font-bold text-white block">{log.action}</span>
                        <span className="text-slate-400">{log.details}</span>
                      </div>
                      <span className="text-slate-500 font-mono">{log.time}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-slate-950/80 py-6 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
              <span>© 2026 Kinetiq Fitness Tracking Application • GUVI Project</span>
              <span className="text-emerald-400 font-mono">System Online (v2.4)</span>
            </div>
          </footer>

          {/* TOAST CONTAINER */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`p-4 rounded-xl shadow-2xl border text-xs font-semibold backdrop-blur-xl ${
                  t.type === 'success' ? 'bg-slate-900/95 border-emerald-500/50 text-emerald-300' :
                  t.type === 'warning' ? 'bg-slate-900/95 border-amber-500/50 text-amber-300' :
                  t.type === 'error' ? 'bg-slate-900/95 border-rose-500/50 text-rose-300' :
                  'bg-slate-900/95 border-cyan-500/50 text-cyan-300'
                }`}
              >
                {t.message}
              </div>
            ))}
          </div>

          {/* MODAL: LOG WORKOUT */}
          {isWorkoutModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-4">Log New Workout</h3>
                <form onSubmit={handleSaveWorkout} className="space-y-4 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1">Routine / Workout Title</label>
                    <input
                      type="text"
                      placeholder="e.g. Morning 5K Run or Leg Day"
                      value={woTitle}
                      onChange={(e)=>setWoTitle(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 block mb-1">Category</label>
                      <select value={woType} onChange={(e)=>setWoType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                        <option>Cardio</option>
                        <option>Strength</option>
                        <option>HIIT</option>
                        <option>Yoga</option>
                        <option>Cycling</option>
                        <option>Pilates</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Intensity</label>
                      <select value={woIntensity} onChange={(e)=>setWoIntensity(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                        <option>Extreme</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 block mb-1">Duration ({woDuration} min)</label>
                      <input
                        type="range"
                        min="5"
                        max="180"
                        step="5"
                        value={woDuration}
                        onChange={(e)=>setWoDuration(Number(e.target.value))}
                        className="w-full accent-cyan-500"
                      />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Calories Burned (kcal)</label>
                      <input
                        type="number"
                        value={woCalories}
                        onChange={(e)=>setWoCalories(Number(e.target.value))}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Notes (Optional)</label>
                    <textarea
                      rows="2"
                      value={woNotes}
                      onChange={(e)=>setWoNotes(e.target.value)}
                      placeholder="Heart rate, distance, weights used..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={()=>setIsWorkoutModalOpen(false)} className="px-4 py-2 text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold">Log Workout</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ADD USER */}
          {isUserModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                <h3 className="text-lg font-bold text-white mb-4">Create User Account</h3>
                <form onSubmit={handleSaveUser} className="space-y-4 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      value={newUserName}
                      onChange={(e)=>setNewUserName(e.target.value)}
                      placeholder="e.g. Alex Henderson"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                    />
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">Email Address</label>
                    <input
                      type="email"
                      required
                      value={newUserEmail}
                      onChange={(e)=>setNewUserEmail(e.target.value)}
                      placeholder="alex.h@example.com"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-300 block mb-1">Role</label>
                      <select value={newUserRole} onChange={(e)=>setNewUserRole(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                        <option>User</option>
                        <option>Admin</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">Fitness Goal</label>
                      <select value={newUserGoal} onChange={(e)=>setNewUserGoal(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                        <option>Weight Loss</option>
                        <option>Muscle Hypertrophy</option>
                        <option>Cardio Endurance</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={()=>setIsUserModalOpen(false)} className="px-4 py-2 text-slate-400 hover:text-white">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold">Create User</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
